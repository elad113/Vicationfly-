name: Build Android APK
on:
  push:
    branches: [main, ashes-of-eldoria]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web game
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Lock landscape orientation
        run: sed -i 's/android:name="\.MainActivity"/android:name="\.MainActivity" android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashes-of-eldoria-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
